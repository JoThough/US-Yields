name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Check JavaScript syntax
        run: node --check site/app.js
