name: Update Data and Publish to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 15,23 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  build:
    name: Test, Update Official Rates, and Package Site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Check JavaScript syntax
        run: node --check site/app.js
      - name: Update official rates
        run: python3 scripts/update_data.py
      - name: Commit meaningful data changes
        run: |
          git add site/data/rates.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update official interest rates"
            git push origin HEAD:main
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
