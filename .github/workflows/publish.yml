name: Update Data and Publish to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 15,23 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  build:
    name: Test, Update Official Rates, and Package Site
    if: >-
      github.repository == 'JoThough/US-Yields' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Check JavaScript syntax
        run: for f in site/*.js; do node --check "$f"; done
      - name: Update official rates
        run: python3 scripts/update_data.py
      # Curve history, TIPS, FRED and Fiscal Data. A failure here must not block
      # publishing the core rates above, so it is reported as a warning only.
      # The FRED key is a repository secret and is passed to this step only.
      - name: Update extended datasets
        continue-on-error: true
        timeout-minutes: 25
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 -u scripts/update_extended_data.py
      - name: Upload generated data for the commit job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: updated-data
          path: site/data
          if-no-files-found: error
          retention-days: 1
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  commit-data:
    name: Commit Generated Rates
    needs: build
    if: github.repository == 'JoThough/US-Yields' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # This job never executes repository scripts or tests.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # Only download the named artifact from this same workflow run.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: updated-data
          path: ${{ runner.temp }}/updated-data
      - name: Commit meaningful data changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          src="$RUNNER_TEMP/updated-data"
          # Accept only regular JSON files that parse; never links or other file types.
          if [ -n "$(find "$src" -type l)" ]; then echo "::error::Generated data contains symbolic links"; exit 1; fi
          if [ -n "$(find "$src" -type f ! -name '*.json')" ]; then echo "::error::Generated data contains non-JSON files"; exit 1; fi
          test -f "$src/rates.json"
          find "$src" -type f -name '*.json' -print0 | xargs -0 -n1 python3 -I -m json.tool > /dev/null
          mkdir -p site/data
          cp -R "$src/." site/data/
          find site/data -type f -name '*.json' -exec chmod 0644 {} +
          git add -- site/data
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -c core.hooksPath=/dev/null commit -m "Update official interest rates"
            auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            echo "::add-mask::$auth"
            git -c core.hooksPath=/dev/null -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:main
          fi

  deploy:
    name: Deploy to GitHub Pages
    needs: [build, commit-data]
    if: github.repository == 'JoThough/US-Yields' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
